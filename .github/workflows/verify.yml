name: Verify portable lifecycle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s scripts -p test_setup.py -v
      - run: python -B scripts/validate_repo.py
